<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frogger</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../arcade-game-theme.css"></head><body class="arcade-game-page"><main class="game-shell"><header class="game-header"><h1>FROGGER</h1><button class="music-toggle" id="sound-toggle" aria-label="Toggle sound">🔊</button></header><section class="game-layout"><div class="board-section"><div class="board-wrapper"><canvas id="game" width="420" height="600" aria-label="Frogger game board"></canvas></div><div class="mobile-controls"><div class="control-row"><button data-dir="up">▲</button></div><div class="control-row"><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div></div><aside class="game-info"><div class="info-box"><h2>Score</h2><p id="score">0</p></div><div class="info-box"><h2>Lives</h2><p id="lives">3</p></div><div class="info-box"><h2>Home</h2><p id="homes">0 / 5</p></div><button class="start-button" id="start">Start Game</button><button class="secondary-button" id="pause">Pause</button><p class="hint">Arrow keys or W A S D to move. Reach a green home pad without getting hit or falling in the water.</p></aside></section><section class="game-over-screen" id="message" hidden><h2>READY, FROG?</h2><p>Cross the road, ride the logs, and reach all five home pads.</p><button id="message-start">Start Game</button></section></main><script>if(new URLSearchParams(location.search).has("preview")){document.documentElement.classList.add("arcade-preview-mode");document.body.classList.add("arcade-preview-mode");}</script><script src="app.js"></script></body></html>
