<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../arcade-game-theme.css"></head><body class="arcade-game-page"><main class="game-shell"><header class="game-header"><h1>2048</h1><button class="music-toggle" id="sound-toggle" aria-label="Toggle sound">🔊</button></header><section class="game-layout"><div class="board-section"><div class="board-wrapper"><div class="board" id="board" role="grid" aria-label="2048 tile board"></div></div><div class="mobile-controls"><div class="control-row"><button data-dir="up">▲</button></div><div class="control-row"><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div></div><aside class="game-info"><div class="info-box"><h2>Score</h2><p id="score">0</p></div><div class="info-box"><h2>Best</h2><p id="best">0</p></div><button class="start-button" id="new-game">New Game</button><p class="hint">Use arrow keys or W A S D to slide tiles. Combine matching numbers to reach 2048.</p></aside></section><section class="game-over-screen" id="message" hidden><h2 id="message-title">GAME OVER</h2><p id="message-text">No more moves.</p><button id="try-again">Try Again</button></section></main><script>if(new URLSearchParams(location.search).has("preview")){document.documentElement.classList.add("arcade-preview-mode");document.body.classList.add("arcade-preview-mode");}</script><script src="app.js"></script></body></html>
