<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doodle Jumper | Fairy's Arcade</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../arcade-game-theme.css"></head><body class="arcade-game-page"><main class="game-shell"><header class="game-header"><h1>DOODLE JUMPER</h1></header><section class="game-layout"><div class="board-section"><div class="board-wrapper"><canvas id="game" width="420" height="560" aria-label="Doodle Jumper game"></canvas></div><div class="mobile-controls"><div class="control-row"><button id="left">◀</button><button id="right">▶</button></div></div></div><aside class="game-info"><div class="info-box"><h2>Height</h2><p id="score">0</p></div><div class="info-box"><h2>Best</h2><p id="best">0</p></div><div class="info-box"><h2>Status</h2><p id="status">Ready</p></div><button id="start" class="start-button">Start Game</button><p class="hint">Use ← → or A / D. Land on platforms to bounce higher. Grab spring boosts; some high platforms move or break.</p></aside></section><section id="message" class="game-over-screen" hidden><h2 id="message-title">READY?</h2><p id="message-text">Bounce upward and try to reach a new height record.</p></section></main><script>if(new URLSearchParams(location.search).get("preview")==="static"){document.documentElement.classList.add("arcade-preview-mode");document.body.classList.add("arcade-preview-mode");}</script><script src="app.js"></script></body></html>
