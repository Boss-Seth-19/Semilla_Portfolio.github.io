<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tetris</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="tetris-game">

        <header class="game-header">
            <h1>Tetris</h1>

            <button
                id="music-toggle"
                class="music-toggle"
                type="button"
                aria-label="Toggle music">
                🔊
            </button>
        </header>

        <section class="game-layout">

            <div class="board-section">

                <div class="board-wrapper">
                    <canvas
                        id="tetris-board"
                        width="300"
                        height="600">
                    </canvas>
                </div>

                <div class="mobile-controls">

                    <div class="control-row">
                        <button id="move-left" type="button">◀</button>
                        <button id="move-right" type="button">▶</button>
                    </div>

                    <div class="control-row">
                        <button id="rotate-ccw" type="button">↺</button>
                        <button id="rotate-cw" type="button">↻</button>
                        <button id="soft-drop" type="button">▼</button>
                        <button id="hard-drop" type="button">⏬</button>
                    </div>

                    <div class="control-row">
                        <button id="hold-piece" type="button">HOLD</button>
                    </div>

                </div>

            </div>

            <aside class="game-info">

                <div class="info-box">
                    <h2>Score</h2>
                    <p id="score">0</p>
                </div>

                <div class="info-box">
                    <h2>Lines</h2>
                    <p id="lines">0</p>
                </div>

                <div class="info-box">
                    <h2>Level</h2>
                    <p id="level">1</p>
                </div>

                <div class="piece-box">
                    <h2>Next</h2>

                    <canvas
                        id="next-piece"
                        width="120"
                        height="120">
                    </canvas>
                </div>

                <div class="piece-box">
                    <h2>Hold</h2>

                    <canvas
                        id="hold-piece-preview"
                        width="120"
                        height="120">
                    </canvas>
                </div>

                <button
                    id="start-button"
                    class="start-button"
                    type="button">
                    Start Game
                </button>

            </aside>

        </section>

        <section
            id="game-over-screen"
            class="game-over-screen"
            hidden>

            <h2>GAME OVER</h2>

            <p>
                Final Score:
                <span id="final-score">0</span>
            </p>

            <button
                id="restart-button"
                type="button">
                Restart
            </button>

        </section>

        <p class="desktop-controls">
            W / Q Rotate &nbsp; • &nbsp;
            A / D Move &nbsp; • &nbsp;
            S Soft Drop &nbsp; • &nbsp;
            Space Hard Drop
            Shift = Hold Piece
        </p>

    </main>

    <audio
    id="tetris-music"
    src="music/tetris-99-main-theme.mp3"
    loop
    preload="auto">
</audio>

    <script src="app.js"></script>

</body>
</html>
