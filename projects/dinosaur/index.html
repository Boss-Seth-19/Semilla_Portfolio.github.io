<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinosaur Run | Fairy's Arcade</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../arcade-game-theme.css"></head><body class="arcade-game-page"><main class="game-shell"><header class="game-header"><h1>DINOSAUR RUN</h1></header><section class="game-layout"><div class="board-section"><div class="board-wrapper"><canvas id="game" width="720" height="260" aria-label="Dinosaur runner game"></canvas></div><p class="hint">Press Space / ↑ or tap the game area to jump over cacti.</p></div><aside class="game-info"><div class="info-box"><h2>Score</h2><p id="score">0</p></div><div class="info-box"><h2>Best</h2><p id="best">0</p></div><div class="info-box"><h2>Status</h2><p id="status">Ready</p></div><button id="start" class="start-button">Start Game</button><button id="jump" class="secondary-button">Jump</button></aside></section><section id="message" class="game-over-screen" hidden><h2 id="message-title">READY TO RUN?</h2><p id="message-text">Jump over the cacti for as long as you can.</p></section></main><script>if(new URLSearchParams(location.search).has("preview")){document.documentElement.classList.add("arcade-preview-mode");document.body.classList.add("arcade-preview-mode");}</script><script src="app.js"></script></body></html>
