<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1026"><title>Galaga | Fairy's Arcade</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../arcade-game-theme.css"></head>
<body class="arcade-game-page projects-galaga"><main class="game-shell"><header class="game-header"><a class="back-link" href="../../arcade.html">FAIRY'S ARCADE</a><h1>GALAGA</h1><button class="music-toggle" id="sound-toggle" aria-label="Toggle sound">♫</button></header>
<section class="game-layout"><div class="board-section"><div class="board-wrapper"><canvas id="game" width="480" height="600" aria-label="Galaga gameplay"></canvas><section class="game-over-screen" id="message" hidden><h2 id="message-title">READY, PLAYER?</h2><p id="message-text">Fly through the starfield, break the alien formation, and survive the next wave.</p><button id="message-start">Start Game</button></section></div><div class="mobile-controls"><div class="control-row"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div><div class="control-row"><button data-key="Space">FIRE</button></div></div></div>
<aside class="game-info"><div class="info-box"><h2>Score</h2><p id="score">000000</p></div><div class="info-box"><h2>Lives</h2><p id="lives">3</p></div><div class="info-box"><h2>Wave</h2><p id="wave">1</p></div><button class="start-button" id="start">Start Game</button><button class="secondary-button" id="pause">Pause</button><p class="hint">Move: A / D or ← / →<br>Fire: Space<br>Pause: P</p></aside></section>
</main><script src="app.js"></script></body></html>
